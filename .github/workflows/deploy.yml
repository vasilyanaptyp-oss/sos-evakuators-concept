# Deploys the production build to autopalidziba.lv over FTP on every push to main
# (and on demand from the Actions tab). Credentials live only in the repository
# secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD - never in this file.
name: Deploy to autopalidziba.lv

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload changed files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: public_html/
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            admin/storage/**
            scripts/**
            _shots/**
            README.md
            .nojekyll
